services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ghatverse
      POSTGRES_USER: ghatverse
      POSTGRES_PASSWORD: ghatverse
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: ./backend
    depends_on: [postgres,mongodb]
    environment:
      DATABASE_URL: postgresql+psycopg://ghatverse:ghatverse@postgres:5432/ghatverse
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: ghatverse
      FRONTEND_ORIGIN: http://localhost:5173
      SECRET_KEY: change-me
    ports: ["5000:5000"]
    volumes: ["./backend:/app"]
volumes:
  postgres_data:
  mongo_data:
